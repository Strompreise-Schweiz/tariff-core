name: Reusable deploy GitHub Pages

# Builds the site with engine/build-site.ts and deploys it. The calling repo needs
# Settings > Pages > Source: "GitHub Actions". The hub repo is the organization site
# and carries the own domain; org repos are project sites below it.

on:
  workflow_call:
    inputs:
      engine-ref:
        description: "Ref of tariff-core to use for the engine"
        required: false
        type: string
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v5

      - name: Checkout tariff-core engine
        uses: actions/checkout@v5
        with:
          repository: Strompreise-Schweiz/tariff-core
          ref: ${{ inputs.engine-ref }}
          path: _engine

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: _engine/.nvmrc

      - name: Build site
        run: node _engine/engine/build-site.ts --out _site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
