name: Reusable fetch dynamic tariffs

on:
  workflow_call:
    inputs:
      engine-ref:
        description: "Ref of tariff-core to use for the engine"
        required: false
        type: string
        default: main

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v5

      - name: Checkout tariff-core engine
        uses: actions/checkout@v5
        with:
          repository: Strompreise-Schweiz/tariff-core
          ref: ${{ inputs.engine-ref }}
          path: _engine

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: _engine/.nvmrc

      - name: Fetch and normalize tariffs
        id: fetch
        continue-on-error: true
        run: node _engine/engine/fetch-and-normalize.ts

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: dynamic tariffs $(TZ=Europe/Zurich date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Fail the run if data is missing
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Fetching failed or expected data is missing. See the fetch step."
          exit 1
