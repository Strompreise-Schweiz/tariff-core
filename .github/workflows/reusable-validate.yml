name: Reusable validate org repo

on:
  workflow_call:
    inputs:
      engine-ref:
        description: "Ref of tariff-core to use for the engine"
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Strompreise-Schweiz/tariff-core
          ref: ${{ inputs.engine-ref }}
          path: _engine
      - uses: actions/setup-node@v6
        with:
          node-version-file: _engine/.nvmrc
          cache: npm
          cache-dependency-path: _engine/package-lock.json
      - run: npm ci --prefix _engine --omit=dev
      - run: node _engine/engine/validate.ts
