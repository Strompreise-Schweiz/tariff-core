name: Reusable update

# Downloads what the utility publishes (engine/fetch.ts), builds every published file from it and
# from curation/ (engine/build.ts), and commits data/. Works in an org repo and in the hub repo.

on:
  workflow_call:
    inputs:
      fetch:
        description: "What to download first: tariffs, prices, all or none (none rebuilds from data/sources/)"
        required: false
        type: string
        default: all
      engine-ref:
        description: "Ref of tariff-core to use for the engine"
        required: false
        type: string
        default: main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v5

      - name: Checkout tariff-core engine
        uses: actions/checkout@v5
        with:
          repository: Strompreise-Schweiz/tariff-core
          ref: ${{ inputs.engine-ref }}
          path: _engine

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: _engine/.nvmrc
          cache: npm
          cache-dependency-path: _engine/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix _engine --omit=dev

      - name: Fetch
        id: fetch
        if: inputs.fetch != 'none'
        continue-on-error: true
        env:
          FETCH: ${{ inputs.fetch }}
        run: |
          case "$FETCH" in
            tariffs) node _engine/engine/fetch.ts --tariffs ;;
            prices) node _engine/engine/fetch.ts --prices ;;
            all) node _engine/engine/fetch.ts ;;
            *) echo "::error::fetch must be tariffs, prices, all or none, not $FETCH"; exit 2 ;;
          esac

      - name: Build
        id: build
        continue-on-error: true
        run: node _engine/engine/build.ts

      - name: Commit and push if changed
        env:
          FETCH: ${{ inputs.fetch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # An org repo keeps its data in data/, the hub repo in utilities/<slug>/data/.
          for path in data utilities; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: update ($FETCH) $(TZ=Europe/Zurich date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Fail the run if something is missing or wrong
        if: steps.fetch.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "::error::Fetch or build reported errors. See their steps and data/checks.json."
          exit 1
